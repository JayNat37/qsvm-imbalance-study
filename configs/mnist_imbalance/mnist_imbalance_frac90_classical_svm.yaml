name: mnist_imbalance_frac90_classical_svm

dataset:
  name: mnist_01
  params:
    fixed_size: 100
    imbalance_fraction: 0.9
  test_size: 0.3
  split_seed: 42
  scale: true
  pca_components: 5
  max_samples: 1000
  minmax_scale: true

model:
  kind: classical_svm
  classical_svm:
    kernel: rbf
    C: 0.1
    gamma: 1

runs:
  repeats: 1
  vary_seed: True
  seed_start: 0
