name: moons_b3_qsvm_shots_sweep

dataset:
  name: make_moons
  params:
    n_samples: 120
    noise: 0.2
    random_seed: 42
  test_size: 0.3
  split_seed: 42
  scale: true
  pca_components: null
  max_samples: null

model:
  kind: qsvm
  qsvm:
    feature_map: pauli
    reps: 1
    entanglement: linear
    mode: noisy_aer
    shots: 1024           # overridden
    seed: 0
    scale_to_pi: true
    C: 10.0
    noise:
      type: none
      strength: 0.0
      params: {}
      apply_to: all

runs:
  repeats: 10             # average over shot randomness
  vary_seed: True
  seed_start: 0

sweep:
  path: model.qsvm.shots
  values: [128, 256, 512, 1024, 2048, 4096]