name: moons_b6_qsvm_shots_noisyaer_baseline

dataset:
  name: make_moons
  params:
    n_samples: 300
    noise: 0.2
    random_seed: 42
  test_size: 0.3
  split_seed: 42
  scale: true
  pca_components: null
  max_samples: null

model:
  kind: qsvm
  qsvm:
    feature_map: pauli
    reps: 1
    entanglement: linear
    mode: noisy_aer
    shots: 2048
    seed: 42
    scale_to_pi: true
    C: 10.0
    noise:
      type: none
      strength: 0.0
      params: {}
      apply_to: all

runs:
  repeats: 10
  vary_seed: True
  seed_start: 0


