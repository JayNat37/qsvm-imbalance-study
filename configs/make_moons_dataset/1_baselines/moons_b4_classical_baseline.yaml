name: moons_b4_classical_baseline

dataset:
  name: make_moons
  params:
    n_samples: 300
    noise: 0.2
    random_seed: 42
  test_size: 0.3
  split_seed: 42
  scale: true

model:
  kind: classical_svm
  classical_svm:
    kernel: rbf
    C: 10.0
    gamma: scale

runs:
  repeats: 10
  vary_seed: True
  seed_start: 0



