name: banknote_b2_qsvm_shot_noise_baseline

dataset:
  name: banknote
  params:
    path: data/data_banknote_authentication.txt
  test_size: 0.3
  split_seed: 42
  scale: true
  max_samples: 300

model:
  kind: qsvm
  qsvm:
    feature_map: pauli
    reps: 1
    entanglement: linear
    mode: noisy_aer
    shots: 2048
    seed: 42
    scale_to_pi: true
    C: 10.0
    noise:
      type: none
      strength: 0.0
      params: {}
      apply_to: all

runs:
  repeats: 10
  vary_seed: true
  seed_start: 0