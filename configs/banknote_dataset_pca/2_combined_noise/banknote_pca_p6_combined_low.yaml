name: banknote_pca_p6_combined_low

dataset:
  name: banknote
  params:
    path: data/data_banknote_authentication.txt
  test_size: 0.3
  split_seed: 42
  scale: true
  pca_components: 2
  max_samples: 300

model:
  kind: qsvm
  qsvm:
    feature_map: pauli
    reps: 1
    entanglement: linear
    mode: noisy_aer
    shots: 2048
    seed: 42
    scale_to_pi: true
    C: 10.0
    noise:
      type: combined
      strength: 1.0
      params:
        depol: 0.01
        amp: 0.01
        phase: 0.01
      apply_to: all

runs:
  repeats: 10
  vary_seed: true
  seed_start: 0